name: Minecraft Plugin Derleyici
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Kodları Getir
      uses: actions/checkout@v4

    - name: Zip Dosyasını Aç ve Klasöre Gir
      run: |
        unzip *.zip
        rm *.zip
        # Zip içerisindeki ana klasörün adını düzeltmek için:
        if [ -d "EduCraftPlugin" ]; then
          mv EduCraftPlugin/* . 2>/dev/null || true
          mv EduCraftPlugin/.* . 2>/dev/null || true
        fi

    - name: Java Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Maven ile JAR Yap
      run: |
        if [ -f "pom.xml" ]; then
          mvn clean package
        fi

    - name: Hazır JAR Dosyasını Teslim Et
      uses: actions/upload-artifact@v4
      with:
        name: EduCraftPlugin-Hazir
        path: |
          **/target/*.jar
